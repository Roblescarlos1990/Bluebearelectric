<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>VoltFlow System Check</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body style="padding:32px">
  <main class="admin-panel" style="max-width:850px;margin:auto">
    <h1>VoltFlow System Check</h1>
    <p>If this page has a dark Blue Bear layout, the root CSS loaded.</p>
    <div id="js-check" class="badge">JavaScript pending…</div>
    <h3>Image check</h3>
    <img src="assets/images/site/logo.jpg" alt="Blue Bear logo" style="max-width:260px;border-radius:12px" onload="document.getElementById('img-check').textContent='Image loaded successfully'" onerror="document.getElementById('img-check').textContent='IMAGE FAILED — assets/images/site/logo.jpg is missing'">
    <p id="img-check">Image pending…</p>
    <h3>Direct checks</h3>
    <p><a class="btn yellow" href="style.css">Open root CSS</a> <a class="btn blue" href="assets/images/site/logo.jpg">Open logo file</a> <a class="btn dark" href="admin.html">Open Admin</a></p>
  </main>
  <script>document.getElementById('js-check').textContent='JavaScript loaded successfully';</script>
</body>
</html>
