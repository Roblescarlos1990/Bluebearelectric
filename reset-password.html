<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="robots" content="noindex,nofollow" />
    <title>Reset Password | Blue Bear Electric</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="portal.css" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link
      rel="icon"
      href="assets/branding/blue-bear/favicon-32.png"
      type="image/png"
      sizes="32x32"
    />
    <link
      rel="apple-touch-icon"
      href="assets/branding/blue-bear/apple-touch-icon.png"
      sizes="180x180"
    />
    <link rel="manifest" href="site.webmanifest" />
  </head>
  <body class="portal-body">
    <main class="portal-wrap">
      <section class="portal-auth single">
        <div class="portal-card">
          <img
            class="reset-logo"
            src="assets/branding/blue-bear/logo-mark-solid.png"
            alt="Blue Bear Electric"
            width="1254"
            height="1254"
            srcset="
              assets/branding/blue-bear/optimized/logo-mark-solid-96.webp   96w,
              assets/branding/blue-bear/optimized/logo-mark-solid-192.webp 192w,
              assets/branding/blue-bear/optimized/logo-mark-solid-384.webp 384w
            "
            sizes="160px"
            decoding="async"
            loading="lazy"
          /><span class="portal-kicker">SECURE ACCOUNT</span>
          <h1>Set a New Password</h1>
          <form class="portal-form" data-reset-form>
            <label
              >New password<input name="password" type="password" minlength="8" required /></label
            ><label
              >Confirm password<input
                name="confirm_password"
                type="password"
                minlength="8"
                required /></label
            ><button class="btn yellow" type="submit">Update Password</button>
            <p class="form-status" data-reset-status></p>
          </form>
          <a class="portal-link center" href="employee-portal.html">Return to Employee Portal</a>
        </div>
      </section>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="assets/js/image-performance.js"></script>

    <script src="assets/js/supabase-config.js"></script>
    <script src="assets/js/reset-password-v1.js"></script>
  </body>
</html>
